# The real-host check of the hosting (deploy/hosting/test/README.md): a Debian 12 host running
# systemd, and MinIO standing in for the EU object storage. Privileged: never in CI.
services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: gfaccess
      MINIO_ROOT_PASSWORD: gfsecret-0123456789
  host:
    build: .
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./.work:/work
      - ..:/hosting:ro
    depends_on: [minio]
