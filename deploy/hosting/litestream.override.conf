# /etc/systemd/system/litestream.service.d/guestflow.conf (specs/hosting-h1-fleet-runtime.md
# H-D3, rule 21). Litestream runs as its own user `guestflow-backup` (group guestflow-app), not root
# and not an instance: it needs the databases and their WAL, nothing else; its /proc hides the others. Its configuration is root-owned (written by guestflow-litestream-apply) and its
# object storage keys come from /etc/default/litestream (root, 600, read by systemd).
[Service]
User=guestflow-backup
Group=guestflow-app
UMask=0007
EnvironmentFile=/etc/default/litestream
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
NoNewPrivileges=true
ReadWritePaths=/srv/guestflow/instances
InaccessiblePaths=/srv/guestflow/console /srv/guestflow/envs -/srv/guestflow/.config -/run/caddy -/etc/guestflow
ProtectProc=invisible
ProcSubset=pid
CapabilityBoundingSet=
# No RestrictSUIDSGID=: Litestream creates its state directory in the setgid instance directory.
