# /etc/systemd/system/litestream.service.d/guestflow.conf (specs/hosting-h1-fleet-runtime.md
# H-D3, rule 21). Litestream runs as the instances' user, not root: it needs the databases and their
# WAL, nothing else. Its configuration is root-owned (written by guestflow-litestream-apply) and its
# object storage keys come from /etc/default/litestream (root, 600, read by systemd).
[Service]
User=guestflow-app
Group=guestflow-app
UMask=0007
EnvironmentFile=/etc/default/litestream
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
NoNewPrivileges=true
ReadWritePaths=/srv/guestflow/instances
InaccessiblePaths=/srv/guestflow/console -/srv/guestflow/.config -/run/caddy -/etc/guestflow
CapabilityBoundingSet=
RestrictSUIDSGID=true
