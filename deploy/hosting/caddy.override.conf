# /etc/systemd/system/caddy.service.d/guestflow.conf (specs/hosting-h1-fleet-runtime.md rule 21).
# Caddy's admin API listens on a unix socket in /run/caddy (caddy:caddy, 0750): the console's user
# is in the `caddy` group, the instances are not and do not even see the directory.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
