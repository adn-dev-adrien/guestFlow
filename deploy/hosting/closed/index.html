<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace fermé</title>
<style>
:root{--paper:#F5F0E6;--ink:#1F241D;--muted:#5F665A;--sapin:#2E3B2A}
@media (prefers-color-scheme: dark){:root{--paper:#161C16;--ink:#EDE8DC;--muted:#A8AE9F;--sapin:#C9D8BC}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px 16px}
main{max-width:420px;text-align:center}
h1{font:600 26px/1.25 Georgia,serif;color:var(--sapin);margin:0 0 8px}
p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
<h1>Cet espace a été fermé</h1>
<p>Il n’est plus accessible à cette adresse.</p>
</main>
</body>
</html>
