name: E2E smoke (Playwright)

# specs/e2e-playwright-smoke-suite.md §3.2.
#
# Auto-runs on:
#   - pull_request to master → fires on open, every subsequent push to the PR branch,
#     and on re-open. Pull_request (not pull_request_target) keeps secrets safe even
#     when the PR comes from a fork.
#   - push to master → post-merge guard against squash-merge slipping in regressions
#     undetected by direct PR checks.
#
# Runs on ubuntu-latest (GitHub-hosted) — free for public repos, no Pi runner queue.

on:
  # `inte/**` — integration branches that collect a chain of PRs before master (e.g. inte/plugins).
  pull_request:
    branches: [master, 'inte/**']
  push:
    branches: [master, 'inte/**']

# Cancel in-progress runs on the same ref when a newer commit lands.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Same rationale as unit-tests.yml: without `check-latest`, setup-node reuses the runner's
          # cached 24.x and CI never sees the patch that just shipped.
          check-latest: true

      - name: 📚 Install root + client + server deps
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: ⚛️ Build native modules against the runtime Node
        # better-sqlite3 ships prebuilt binaries that may not match the Ubuntu runner's
        # Node ABI. Forcing a rebuild from source guarantees compatibility — same idiom
        # as deploy.yml.
        run: |
          cd server
          env npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: 🎭 Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run the E2E smoke suite
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: 📤 Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # specs/plugins-phase-0-foundation.md rule 28 — a new customer with no plugin: nothing of a plugin
  # shows or is called, and the core runs a stay end to end. Its own database and process.
  bare:
    name: bare install (no plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: 📚 Install root + client + server deps
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: ⚛️ Build native modules against the runtime Node
        run: |
          cd server
          env npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: 🎭 Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run the bare-install suite
        env:
          CI: 'true'
        run: npm run test:e2e:bare

      - name: 📤 Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-bare
          path: playwright-report-bare/
          retention-days: 7

  # specs/plugins-phase-4-registry.md rule 19 — the production build served by the server, every plugin
  # loaded from its package, beside a test registry: install, update with restart, refusal.
  production-build:
    name: production build (plugin packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: 📚 Install root + client + server deps
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: ⚛️ Build native modules against the runtime Node
        run: |
          cd server
          env npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: 🏗️ Build the client and the plugin packages
        run: |
          (cd client && npm run build)
          node scripts/build-plugin-packages.mjs

      - name: 🎭 Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run the production-build suite
        env:
          CI: 'true'
        run: npm run test:e2e:prod

      - name: 📤 Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: playwright-report-prod/
          retention-days: 7
