name: Unit tests

# Runs the server (node --test) and client (vitest) unit suites — which include the public API
# coverage (auth, projections, validation/price-immutability, read-only GET, quote + booking
# flows, and the HTTP integration test for router wiring + rate limiters).
#
# Auto-runs on:
#   - pull_request to master → fires on open, every subsequent push to the PR branch, and re-open.
#     Plain pull_request (not pull_request_target) keeps secrets safe even for fork PRs.
#   - push to master → post-merge guard so a squash-merge can't slip a regression past PR checks.
#
# Manually runnable too (`workflow_dispatch`, optional `ref` input): on 2026-08-06 the
# `client (vitest)` job never got a GitHub-hosted runner on three consecutive attempts (empty
# `runner_name`, zero steps, killed by the 15-min job timeout) while its sibling job and the E2E
# workflow ran fine. Re-running the job kept landing in the same starved queue, and without a manual
# trigger the only way to get a fresh run was an empty commit. `gh workflow run "Unit tests"
# --ref <branch>` now does it.
#
# Runs on ubuntu-latest (GitHub-hosted) — free for public repos, no Pi runner queue. Mirrors the
# conventions of e2e.yml (checkout@v6, setup-node@v6, Node 24, better-sqlite3 rebuilt from source).

on:
  # `inte/**` — integration branches that collect a chain of PRs before master (e.g. inte/plugins).
  pull_request:
    branches: [master, 'inte/**']
  push:
    branches: [master, 'inte/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche ou SHA à tester (défaut : la branche choisie ci-dessus)'
        required: false
        type: string

# Cancel in-progress runs on the same ref when a newer commit lands.
concurrency:
  group: unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # specs/spec-rule-coverage.md §3.2 — la barrière : une règle AJOUTÉE à une spec doit être citée par
  # un test. Uniquement sur les PR, et uniquement sur le diff : les 2 500 règles existantes ne
  # bloquent personne (règle 10). Le 2026-09-01, trois règles écrites en v2.9.0 dormaient sur le
  # papier pendant que 5 000 tests étaient verts ; ce job est ce qui empêche la quatrième.
  spec-rules:
    name: spec rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le contrôle compare les specs à la base de la PR : il faut donc l'historique, pas un
          # checkout superficiel.
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true

      - name: 📏 Une règle ajoutée est-elle citée par un test ?
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          node scripts/check-spec-coverage.mjs --changed --base "origin/${{ github.base_ref }}"

      - name: 🔌 Un plugin modifié porte une nouvelle version et ses lignes de journal
        # specs/plugins-phase-4-registry.md rule 28 — the plugin a PR changes is bumped in that PR, so the
        # release PR only touches the three package.json files and the changelog fold.
        run: node scripts/check-plugin-versions.mjs --base "origin/${{ github.base_ref }}"

      - name: 📅 Une date écrite en dur dans un test ajouté ?
        # specs/server-test-isolation.md rule 7 — a literal date the calendar will pass, on a test line the PR
        # adds, fails the job with the line named. A date nothing compares with today (a pure function's
        # input, a « now » the test hands to the code) carries `// date-literal-ok: <why>`.
        run: node scripts/check-test-dates.mjs --base "origin/${{ github.base_ref }}" --strict

  server:
    name: server (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual runs may target an explicit ref; otherwise the default (the triggering ref).
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Back to the floating major since better-sqlite3 13 (2026-08-07). It had been pinned to
          # 24.18.0 for a day: on 24.19.0 every test process crashed at EXIT inside better-sqlite3
          # ^11's native teardown. The driver bump is the actual fix — see
          # specs/better-sqlite3-upgrade.md. Keep the major in sync with the Pi's Node (deploy.yml).
          node-version: '24'
          # `check-latest` because the runner image ships a CACHED 24.x and setup-node prefers it:
          # without this, '24' quietly resolved back to 24.18.0 — the very version that was already
          # green — so CI would NOT have retested the patch that broke us. Always resolving the true
          # latest is what turns this job into the early warning we lacked on 2026-08-06.
          # NOT enabled on deploy.yml on purpose: a release build wants stability, not freshness.
          check-latest: true

      - name: 📚 Install server deps
        run: cd server && npm ci

      - name: ⚛️ Build native modules against the runtime Node
        # better-sqlite3 ships prebuilt binaries that may not match the Ubuntu runner's Node ABI.
        # Forcing a rebuild from source guarantees compatibility — same idiom as e2e.yml/deploy.yml.
        run: |
          cd server
          env npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: 🧪 Run the server unit suite
        run: cd server && npm test

  # specs/server-test-isolation.md rule 8 — three shards. Every test file pays its own fork, jsdom and imports
  # (~1.1 s on the runner), and the one-file-per-subject rule took the suite from 220 files to 625 in a week:
  # in one job it reached 711–798 s of its 900 s cap (audit R8 M-2). Vitest splits the FILES, so each shard
  # keeps per-file isolation and its own `vi.mock` hoisting. The build and the bundle budget run once.
  client:
    name: client (vitest ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual runs may target an explicit ref; otherwise the default (the triggering ref).
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Back to the floating major since better-sqlite3 13 (2026-08-07). It had been pinned to
          # 24.18.0 for a day: on 24.19.0 every test process crashed at EXIT inside better-sqlite3
          # ^11's native teardown. The driver bump is the actual fix — see
          # specs/better-sqlite3-upgrade.md. Keep the major in sync with the Pi's Node (deploy.yml).
          node-version: '24'
          # `check-latest` because the runner image ships a CACHED 24.x and setup-node prefers it:
          # without this, '24' quietly resolved back to 24.18.0 — the very version that was already
          # green — so CI would NOT have retested the patch that broke us. Always resolving the true
          # latest is what turns this job into the early warning we lacked on 2026-08-06.
          # NOT enabled on deploy.yml on purpose: a release build wants stability, not freshness.
          check-latest: true

      - name: 📚 Install client deps
        run: cd client && npm ci

      - name: 🧪 Run the client unit suite (shard ${{ matrix.shard }}/3)
        run: cd client && npm test -- --shard=${{ matrix.shard }}/3

      - name: 📦 Initial JavaScript within its budget
        if: matrix.shard == 1
        # specs/inte-performance.md rule 4 — a heavy import in the shell, or a page imported eagerly
        # again, fails here with the chunks named, instead of reaching the operator as a slow app.
        run: |
          cd client && npm run build
          cd .. && node scripts/check-bundle-budget.mjs

  # specs/control-plane-plans-and-access.md — the control plane (the operator console) is its own app
  # in `control-plane/`, deployed separately, tested here with the rest. Its server requires
  # GuestFlow's licence and password modules and runs `server/scripts/create-first-admin.js` in the
  # tests, so the GuestFlow server's dependencies are installed too.
  console-server:
    name: control-plane server (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true

      - name: 📚 Install deps (console server + GuestFlow server)
        run: |
          cd server && npm ci && cd ..
          cd control-plane/server && npm ci

      - name: ⚛️ Build native modules against the runtime Node
        run: |
          (cd server && env npm_config_build_from_source=true npm rebuild better-sqlite3)
          (cd control-plane/server && env npm_config_build_from_source=true npm rebuild better-sqlite3)

      - name: 🧪 Run the control-plane server suite
        run: cd control-plane/server && npm test

  # The console's client imports GuestFlow's theme and generic components from `client/src` (`@gf/`)
  # but resolves React, MUI and the router from its own node_modules (control-plane/client/shared.config.js),
  # so only its own dependencies are installed.
  console-client:
    name: control-plane client (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true

      - name: 📚 Install console client deps
        run: cd control-plane/client && npm ci

      - name: 🧪 Run the control-plane client suite
        run: cd control-plane/client && npm test

      - name: 🏗️ Build the console
        run: cd control-plane/client && npm run build
