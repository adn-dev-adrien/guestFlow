name: Unit tests

# Runs the server (node --test) and client (vitest) unit suites — which include the public API
# coverage (auth, projections, validation/price-immutability, read-only GET, quote + booking
# flows, and the HTTP integration test for router wiring + rate limiters).
#
# Auto-runs on:
#   - pull_request to master → fires on open, every subsequent push to the PR branch, and re-open.
#     Plain pull_request (not pull_request_target) keeps secrets safe even for fork PRs.
#   - push to master → post-merge guard so a squash-merge can't slip a regression past PR checks.
#
# Manually runnable too (`workflow_dispatch`, optional `ref` input): on 2026-08-06 the
# `client (vitest)` job never got a GitHub-hosted runner on three consecutive attempts (empty
# `runner_name`, zero steps, killed by the 15-min job timeout) while its sibling job and the E2E
# workflow ran fine. Re-running the job kept landing in the same starved queue, and without a manual
# trigger the only way to get a fresh run was an empty commit. `gh workflow run "Unit tests"
# --ref <branch>` now does it.
#
# Runs on ubuntu-latest (GitHub-hosted) — free for public repos, no Pi runner queue. Mirrors the
# conventions of e2e.yml (checkout@v6, setup-node@v6, Node 24, better-sqlite3 rebuilt from source).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche ou SHA à tester (défaut : la branche choisie ci-dessus)'
        required: false
        type: string

# Cancel in-progress runs on the same ref when a newer commit lands.
concurrency:
  group: unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          # Manual runs may target an explicit ref; otherwise the default (the triggering ref).
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Back to the floating major since better-sqlite3 13 (2026-08-07). It had been pinned to
          # 24.18.0 for a day: on 24.19.0 every test process crashed at EXIT inside better-sqlite3
          # ^11's native teardown. The driver bump is the actual fix — see
          # specs/better-sqlite3-upgrade.md. Keep the major in sync with the Pi's Node (deploy.yml).
          node-version: '24'
          # `check-latest` because the runner image ships a CACHED 24.x and setup-node prefers it:
          # without this, '24' quietly resolved back to 24.18.0 — the very version that was already
          # green — so CI would NOT have retested the patch that broke us. Always resolving the true
          # latest is what turns this job into the early warning we lacked on 2026-08-06.
          # NOT enabled on deploy.yml on purpose: a release build wants stability, not freshness.
          check-latest: true

      - name: 📚 Install server deps
        run: cd server && npm ci

      - name: ⚛️ Build native modules against the runtime Node
        # better-sqlite3 ships prebuilt binaries that may not match the Ubuntu runner's Node ABI.
        # Forcing a rebuild from source guarantees compatibility — same idiom as e2e.yml/deploy.yml.
        run: |
          cd server
          env npm_config_build_from_source=true npm rebuild better-sqlite3

      - name: 🧪 Run the server unit suite
        run: cd server && npm test

  client:
    name: client (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          # Manual runs may target an explicit ref; otherwise the default (the triggering ref).
          ref: ${{ inputs.ref || github.ref }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Back to the floating major since better-sqlite3 13 (2026-08-07). It had been pinned to
          # 24.18.0 for a day: on 24.19.0 every test process crashed at EXIT inside better-sqlite3
          # ^11's native teardown. The driver bump is the actual fix — see
          # specs/better-sqlite3-upgrade.md. Keep the major in sync with the Pi's Node (deploy.yml).
          node-version: '24'
          # `check-latest` because the runner image ships a CACHED 24.x and setup-node prefers it:
          # without this, '24' quietly resolved back to 24.18.0 — the very version that was already
          # green — so CI would NOT have retested the patch that broke us. Always resolving the true
          # latest is what turns this job into the early warning we lacked on 2026-08-06.
          # NOT enabled on deploy.yml on purpose: a release build wants stability, not freshness.
          check-latest: true

      - name: 📚 Install client deps
        run: cd client && npm ci

      - name: 🧪 Run the client unit suite
        run: cd client && npm test
